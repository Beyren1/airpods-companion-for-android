# Подписанная сборка для выпуска.
#
# Запускается вручную: Actions → Release → Run workflow. Собирает подписанный APK, кладёт его
# в артефакты запуска и, если отмечено «Create draft release», создаёт черновик GitHub Release
# v<versionName> с этим APK. Черновик видит только владелец репозитория; опубликовать его — кнопка
# Publish release на странице Releases (тег v<versionName> появится в этот момент).
# Тег v* , отправленный из git, делает то же самое.
#
# Ключ подписи берётся из секретов репозитория (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   — файл ключа .jks, закодированный в base64
#   RELEASE_KEYSTORE_PASSWORD — пароль хранилища ключей
#   RELEASE_KEY_ALIAS         — имя ключа (alias)
#   RELEASE_KEY_PASSWORD      — пароль ключа
# Как их создать — docs/vypusk.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Create draft release'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Инструкция: docs/vypusk.md"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # tr убирает переносы строк и \r, которые добавляют некоторые base64-кодировщики.
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace :protocol-aap:test testReleaseUnitTest

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Verify signature and name the APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::Подписанный APK не собрался (есть только unsigned). Проверьте секреты."
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          name="PodsCompanion-$version.apk"
          cp "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.apk.outputs.name }}

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.apk.outputs.version }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName ${{ steps.apk.outputs.version }} в app/build.gradle.kts"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Выпуск $tag уже есть. Увеличьте versionCode и versionName в app/build.gradle.kts или удалите черновик."
            exit 1
          fi
          notes="docs/release-notes/$tag.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$tag" "${{ steps.apk.outputs.name }}" --target "$GITHUB_SHA" \
            --draft --title "Pods Companion ${{ steps.apk.outputs.version }}" "${notes_arg[@]}"
