name: macOS CI

# Программа для Mac. На каждый PR и main — тесты и PodsCompanion-mac.dmg в артефактах.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: macos
        run: swift test
      - name: Build app
        run: macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PodsCompanion-mac
          path: macos/out/PodsCompanion-mac.dmg
